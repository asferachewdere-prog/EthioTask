
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EthioTask</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#172554}
header{background:#087443;color:white;padding:22px;border-radius:14px;text-align:center}
.card{background:white;padding:18px;margin-top:16px;border-radius:14px;box-shadow:0 2px 8px #ddd}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:9px;background:#087443;color:white;font-size:16px}
input{width:95%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>🇪🇹 EthioTask</h1>
<p>በቀላሉ ተመዝገበህ ከስራ ጋር ተቀላቀል</p>
</header>
<div class="card">
<h3>📝 የአባልነት ምዝገባ</h3>
<input id="name" placeholder="ሙሉ ስም">
<input id="phone" type="tel" placeholder="ስልክ ቁጥር">
<button onclick="register()">ምዝገባ ጠይቅ</button>
<p id="msg"></p>
</div>
<div class="card">
<h3>📋 የዕለት ስራ</h3>
<p>ከተፈቀደልህ በኋላ የሚገኙ ስራዎችን እዚህ ታያለህ።</p>
</div>
<div class="card">
<h3>💰 ክፍያ</h3>
<p>የክፍያ መረጃ እዚህ ይታያል።</p>
</div>
<script>
function register(){
 const n=document.getElementById('name').value.trim();
 const p=document.getElementById('phone').value.trim();
 const m=document.getElementById('msg');
 if(!n||!p){m.textContent='እባክህ ሙሉ ስምና ስልክ ቁጥር አስገባ።';return;}
 m.textContent='የምዝገባ ጥያቄህ ተዘጋጅቷል። ለመላክ ከቦት ጋር ማገናኘት ያስፈልጋል።';
}
</script>
</body>
</html>
